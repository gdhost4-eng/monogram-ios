name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # versions.json pins Xcode 26.2, which is available on the macOS 26 image.
    runs-on: macos-26
    # A cold build takes 1.5-4h; the GitHub job ceiling is 6h.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Restore private Monogram configuration
        env:
          MONOGRAM_CONFIGURATION_BASE64: ${{ secrets.MONOGRAM_CONFIGURATION_BASE64 }}
        run: |
          if [ -z "$MONOGRAM_CONFIGURATION_BASE64" ]; then
            echo "Missing MONOGRAM_CONFIGURATION_BASE64 repository secret."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("build-system/monogram-development-configuration.json").write_bytes(
              base64.b64decode(os.environ["MONOGRAM_CONFIGURATION_BASE64"], validate=True)
          )
          PY
          python3 scripts/validate_monogram_configuration.py build-system/monogram-development-configuration.json

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Build the IPA
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build \
            --configurationPath="build-system/monogram-development-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build

      - name: Prune Bazel disk cache
        if: success()
        run: |
          # The Actions cache allows 10 GB per repository in total, while a full Bazel
          # disk cache for this project is considerably larger. Keep the most recently
          # used entries under a budget so the upload is accepted rather than rejected.
          python3 - <<'PY'
          import os

          CACHE_DIR = "/Users/Shared/bazel-disk-cache"
          BUDGET = 8 * 1024 ** 3

          if not os.path.isdir(CACHE_DIR):
              raise SystemExit(0)

          entries = []
          for root, _dirs, files in os.walk(CACHE_DIR):
              for name in files:
                  path = os.path.join(root, name)
                  try:
                      stat = os.stat(path)
                  except OSError:
                      continue
                  entries.append((stat.st_mtime, stat.st_size, path))

          total = sum(size for _mtime, size, _path in entries)
          print("Cache size before pruning: {:.2f} GB ({} files)".format(total / 1024 ** 3, len(entries)))

          entries.sort(reverse=True)
          kept = 0
          removed = 0
          for _mtime, size, path in entries:
              if kept + size <= BUDGET:
                  kept += size
              else:
                  try:
                      os.remove(path)
                      removed += 1
                  except OSError:
                      kept += size

          print("Cache size after pruning: {:.2f} GB ({} files removed)".format(kept / 1024 ** 3, removed))
          PY

      - name: Save Bazel disk cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monogram-IPA-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Monogram-dSYM-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 14
