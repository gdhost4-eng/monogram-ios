name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # versions.json pins Xcode 26.2, which is available on the macOS 26 image.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create unsigned build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}

        run: |


            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          configuration = {
              "bundle_id": "com.gdhost4.monogram",
              "api_id": os.environ["TELEGRAM_API_ID"],

              "team_id": "0000000000",
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "monogram",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          Path("build-system/monogram-development-configuration.json").write_text(
              json.dumps(configuration), encoding="utf-8"
          )
          PY
          mkdir -p build-system/unsigned-codesigning/certs
          cp build-system/fake-codesigning/certs/* build-system/unsigned-codesigning/certs/
          python3 build-system/Make/CreateUnsignedProvisioningProfile.py \
            --template build-system/fake-codesigning/profiles/Telegram.mobileprovision \
            --p12 build-system/fake-codesigning/certs/SelfSigned.p12 \
            --team-id 0000000000 \
            --bundle-id com.gdhost4.monogram \
            --output build-system/unsigned-codesigning/profiles/Telegram.mobileprovision
          python3 scripts/validate_monogram_configuration.py build-system/monogram-development-configuration.json

      - name: Validate Monogram Bazel dependencies
        run: python3 build-system/Make/ValidateMonogramDependencies.py

      - name: Validate portable source invariants
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the IPA
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/unsigned-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/monogram-development-configuration.json" \
            --codesigningInformationPath=build-system/unsigned-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions \
            --outputBuildArtifactsPath=build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monogram-IPA-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Monogram-dSYM-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 14
